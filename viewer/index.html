<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shadow Muscle — 3D Интерактивный Сканер Мышц</title>

  <!-- Local high-speed Three.js bundle (Zero external CDN dependency!) -->
  <script src="./js/three.min.js"></script>
  <script src="./js/OrbitControls.js"></script>
  <script src="./js/fflate.min.js"></script>
  <script src="./js/FBXLoader.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #2a2638 0%, #1a1724 60%, #110f18 100%);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas#c3d {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    /* Top App Header & Hint */
    .top-bar {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 25;
    }
    .hero-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #d8b4fe;
      text-transform: uppercase;
      background: rgba(15, 13, 22, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(168, 85, 247, 0.25);
    }
    .hint-badge {
      font-size: 9.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(15, 13, 22, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 4px 9px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Floating Hotspot Muscle Info Card */
    #muscleCard {
      position: absolute;
      top: 42px;
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      width: calc(100% - 24px);
      max-width: 380px;
      padding: 10px 14px;
      background: rgba(22, 19, 32, 0.90);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 16px;
      border: 1px solid rgba(239, 68, 68, 0.5);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 0 20px rgba(239, 68, 68, 0.18);
      z-index: 30;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease;
    }
    #muscleCard.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .card-title-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .card-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    .card-title {
      font-size: 12.5px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.02em;
    }
    .card-badge {
      font-size: 9.5px;
      font-weight: 800;
      color: #f87171;
      background: rgba(239, 68, 68, 0.18);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .card-close {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.15s, color 0.15s;
    }
    .card-close:active {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }
    .card-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #cbd5e1;
      margin-top: 3px;
    }
    .card-row-recovery {
      font-weight: 700;
      color: #6ee7b7;
      margin-top: 4px;
    }
    .card-progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.10);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }
    .card-progress-fill {
      height: 100%;
      width: 65%;
      background: linear-gradient(90deg, #ef4444, #f59e0b);
      border-radius: 4px;
      transition: width 0.35s ease;
    }

    /* Quick Muscle Filter Chips (Above Legend) */
    .chips-strip {
      position: absolute;
      bottom: 42px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      max-width: 96%;
      overflow-x: auto;
      white-space: nowrap;
      padding: 2px 4px;
      z-index: 25;
      scrollbar-width: none;
    }
    .chips-strip::-webkit-scrollbar {
      display: none;
    }
    .muscle-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 700;
      color: #e2e8f0;
      background: rgba(26, 23, 36, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 5px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.12s, border-color 0.15s, background 0.15s;
    }
    .muscle-chip:active {
      transform: scale(0.95);
    }
    .muscle-chip.selected {
      background: rgba(168, 85, 247, 0.25);
      border-color: #a855f7;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
    }
    .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Bottom Recovery Status Legend */
    .legend-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      padding: 4px 10px;
      background: rgba(15, 13, 22, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 16px;
      z-index: 20;
      max-width: 96%;
      overflow-x: auto;
      white-space: nowrap;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
      font-weight: 700;
      color: #cbd5e1;
    }
    .legend-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-red { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.9); }
    .dot-yellow { background: #f59e0b; box-shadow: 0 0 6px rgba(245, 158, 11, 0.9); }
    .dot-green { background: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.9); }

    /* High-Speed Loading Overlay */
    #loadingOverlay {
      position: absolute;
      inset: 0;
      background: #1a1724;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #ffffff;
    }
    .loading-sub {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>

    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const loadingProgress = document.getElementById('loadingProgress');

    const card = document.getElementById('muscleCard');
    const cardDot = document.getElementById('cardDot');
    const cardTitle = document.getElementById('cardTitle');
    const cardBadge = document.getElementById('cardBadge');

    const cardRecovery = document.getElementById('cardRecovery');

    const cardClose = document.getElementById('cardClose');
    const chipsStrip = document.getElementById('chipsStrip');

    let activeHotspotId = 'chest';

    // ==========================================

    // ==========================================

    function createContactShadowTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      const grad = ctx.createRadialGradient(256, 256, 40, 256, 256, 250);
      grad.addColorStop(0.0, 'rgba(12, 10, 20, 0.70)');
      grad.addColorStop(0.4, 'rgba(12, 10, 20, 0.40)');
      grad.addColorStop(0.75, 'rgba(12, 10, 20, 0.12)');
      grad.addColorStop(1.0, 'rgba(12, 10, 20, 0.0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      return new THREE.CanvasTexture(c);
    }

    function createHotspotCanvasTexture(colorHex) {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');

      // Outer pulse ring
      ctx.beginPath();
      ctx.arc(64, 64, 52, 0, Math.PI * 2);
      ctx.strokeStyle = colorHex;
      ctx.lineWidth = 5;
      ctx.globalAlpha = 0.5;
      ctx.stroke();

      // Soft glow aura
      const grad = ctx.createRadialGradient(64, 64, 10, 64, 64, 48);
      grad.addColorStop(0, colorHex);
      grad.addColorStop(0.65, colorHex);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.globalAlpha = 0.35;
      ctx.fill();

      // Mid bright ring
      ctx.beginPath();
      ctx.arc(64, 64, 28, 0, Math.PI * 2);
      ctx.strokeStyle = colorHex;
      ctx.lineWidth = 5;
      ctx.globalAlpha = 0.95;
      ctx.stroke();

      // Core solid dot
      ctx.beginPath();
      ctx.arc(64, 64, 16, 0, Math.PI * 2);
      ctx.fillStyle = colorHex;
      ctx.globalAlpha = 1.0;
      ctx.fill();

      // Center white pip
      ctx.beginPath();
      ctx.arc(64, 64, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      return new THREE.CanvasTexture(c);
    }

    function init() {
      scene = new THREE.Scene();

      const aspect = window.innerWidth / window.innerHeight;
      camera = new THREE.PerspectiveCamera(36, aspect, 0.1, 100);
      camera.position.set(0, 1.0, 4.5);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      // Turntable controls: 100% horizontal 360 rotation
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.rotateSpeed = 0.85;
      controls.target.set(0, 0.95, 0);
      controls.minPolarAngle = Math.PI / 2;
      controls.maxPolarAngle = Math.PI / 2;
      controls.enableZoom = false;
      controls.enablePan = false;

      controls.addEventListener('start', () => {
        // User touched canvas, cancel auto-rotation glide
        isAutoRotating = false;
        targetAzimuth = null;
      });

      // ==========================================
      // LIGHTING RIG
      // ==========================================
      ambLight = new THREE.AmbientLight(0x353246, 0.40);
      scene.add(ambLight);

      // Key Raking Light Front (Pectorals, Abs)
      keyLightFront = new THREE.DirectionalLight(0xfff6eb, 1.95);
      keyLightFront.position.set(2.6, 3.8, 2.4);
      keyLightFront.castShadow = true;
      keyLightFront.shadow.mapSize.width = 1024;
      keyLightFront.shadow.mapSize.height = 1024;
      keyLightFront.shadow.bias = -0.001;
      scene.add(keyLightFront);

      // Rear Lumbar Light (Поясница и нижняя часть широчайших)
      lumbarLight = new THREE.DirectionalLight(0xfff3e6, 1.80);
      lumbarLight.position.set(2.2, 2.6, -2.8);
      lumbarLight.castShadow = true;
      lumbarLight.shadow.mapSize.width = 1024;
      lumbarLight.shadow.mapSize.height = 1024;
      lumbarLight.shadow.bias = -0.001;
      scene.add(lumbarLight);

      // Rear Upper Back / Traps
      keyLightBack = new THREE.DirectionalLight(0xf0e6ff, 1.40);
      keyLightBack.position.set(-2.4, 3.5, -2.6);
      scene.add(keyLightBack);

      // Top Downlight
      topLight = new THREE.DirectionalLight(0xffeedd, 0.90);
      topLight.position.set(0, 5.2, 0.2);
      scene.add(topLight);

      // Left & Right Rim Kickers (Edge separation)
      fillLightLeft = new THREE.DirectionalLight(0xa5b4fc, 1.25);
      fillLightLeft.position.set(-3.8, 2.2, 0);
      scene.add(fillLightLeft);

      fillLightRight = new THREE.DirectionalLight(0xa5b4fc, 1.25);
      fillLightRight.position.set(3.8, 2.2, 0);
      scene.add(fillLightRight);

      // ==========================================
      // CIRCULAR PODIUM
      // ==========================================
      const PODIUM_RADIUS = 0.95;
      const PODIUM_HEIGHT = 0.07;

      const podiumGeo = new THREE.CylinderGeometry(PODIUM_RADIUS, PODIUM_RADIUS * 1.04, PODIUM_HEIGHT, 48);
      const podiumMat = new THREE.MeshStandardMaterial({
        color: 0x484658,
        roughness: 0.50,
        metalness: 0.12
      });
      podiumMesh = new THREE.Mesh(podiumGeo, podiumMat);
      podiumMesh.position.set(0, -PODIUM_HEIGHT / 2, 0);
      podiumMesh.receiveShadow = true;
      podiumMesh.castShadow = true;
      scene.add(podiumMesh);

      const rimGeo = new THREE.TorusGeometry(PODIUM_RADIUS, 0.012, 12, 48);
      const rimMat = new THREE.MeshStandardMaterial({
        color: 0xa855f7,
        emissive: 0xa855f7,
        emissiveIntensity: 0.3,
        roughness: 0.2,
        metalness: 0.5
      });
      podiumRimMesh = new THREE.Mesh(rimGeo, rimMat);
      podiumRimMesh.rotation.x = Math.PI / 2;
      podiumRimMesh.position.set(0, 0, 0);
      scene.add(podiumRimMesh);

      // Ground Shadow
      const shadowTex = createContactShadowTexture();
      const shadowGeo = new THREE.PlaneGeometry(2.8, 2.8);
      const shadowMat = new THREE.MeshBasicMaterial({
        map: shadowTex,
        transparent: true,
        depthWrite: false
      });
      shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
      shadowMesh.rotation.x = -Math.PI / 2;
      shadowMesh.position.y = -PODIUM_HEIGHT - 0.002;
      scene.add(shadowMesh);

      // High-speed optimized textures
      conceptDiffuseTex = textureLoader.load('./textures/diffuse_concept_opt.jpg');
      conceptDiffuseTex.encoding = THREE.sRGBEncoding;

      normalTex = textureLoader.load('./textures/normal_opt.png');
      emissiveTex = textureLoader.load('./textures/emissive_eyes_opt.png');

      window.addEventListener('resize', onWindowResize);

      buildQuickChipsUI();
      buildHotspots();
      setupRaycasting();

      cardClose.addEventListener('click', () => {
        card.classList.remove('active');
        document.querySelectorAll('.muscle-chip').forEach(c => c.classList.remove('selected'));
      });

      loadModel();
      animate();
    }

    const interactiveSprites = [];

    function buildHotspots() {
      hotspotsGroup = new THREE.Group();
      scene.add(hotspotsGroup);

      HOTSPOTS_DATA.forEach(data => {
        const tex = createHotspotCanvasTexture(data.colorHex);
        const mat = new THREE.SpriteMaterial({
          map: tex,
          transparent: true,
          depthWrite: false,
          depthTest: false
        });

        const sprite = new THREE.Sprite(mat);
        sprite.position.copy(data.pos);
        sprite.scale.set(0.18, 0.18, 1);
        sprite.userData = data;

        hotspotsGroup.add(sprite);
        interactiveSprites.push(sprite);
      });
    }

    function buildQuickChipsUI() {
      chipsStrip.innerHTML = '';
      HOTSPOTS_DATA.forEach(data => {
        const chip = document.createElement('div');
        chip.className = 'muscle-chip' + (data.id === activeHotspotId ? ' selected' : '');
        chip.id = 'chip-' + data.id;
        chip.innerHTML = `<span class="chip-dot ${data.dotClass}"></span>${data.shortName}`;

        chip.addEventListener('click', () => {
          selectHotspot(data);
        });

        chipsStrip.appendChild(chip);
      });
    }

    function selectHotspot(data) {
      if (!data) return;
      activeHotspotId = data.id;

      // Update Card Content
      cardDot.style.background = data.colorHex;
      cardDot.style.boxShadow = `0 0 10px ${data.colorHex}`;
      cardTitle.textContent = data.name;

      cardBadge.textContent = data.statusBadge;
      cardBadge.style.color = data.badgeColor;
      cardBadge.style.background = data.badgeBg;
      cardBadge.style.borderColor = data.badgeBorder;

      cardWorkout.textContent = data.workoutInfo;
      cardRecovery.textContent = data.recoveryInfo;

      cardFill.style.width = data.recoveryPercent + '%';
      cardFill.style.background = data.fillGradient;

      card.style.borderColor = data.colorHex;
      card.style.boxShadow = `0 12px 32px rgba(0, 0, 0, 0.55), 0 0 20px ${data.colorHex}33`;
      card.classList.add('active');

      // Update Chips Selection
      document.querySelectorAll('.muscle-chip').forEach(c => c.classList.remove('selected'));
      const activeChip = document.getElementById('chip-' + data.id);
      if (activeChip) activeChip.classList.add('selected');

      // Smooth auto-rotation to face the selected muscle
      if (data.targetAngle !== undefined) {
        targetAzimuth = data.targetAngle;
        isAutoRotating = true;
      }
    }

    function setupRaycasting() {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let pointerDownPos = { x: 0, y: 0 };

      window.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('pointerup', (e) => {
        // Ignore if dragged to orbit
        const dx = Math.abs(e.clientX - pointerDownPos.x);
        const dy = Math.abs(e.clientY - pointerDownPos.y);
        if (dx > 6 || dy > 6) return;

        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactiveSprites, false);

        if (intersects.length > 0) {
          const hit = intersects[0].object;
          if (hit.userData) {
            selectHotspot(hit.userData);
          }
        }
      });
    }

    function fitModelToScreen(model) {
      if (!model) return;

      // In this FBX, the front chest/face points along +X and shoulders are along Z.
      // Rotate -90° (-Math.PI / 2) so chest, abs and glowing eyes face directly forward into the camera!
      model.rotation.y = -Math.PI / 2;
      model.updateMatrixWorld(true);

      let box = new THREE.Box3().setFromObject(model);
      let size = new THREE.Vector3();
      box.getSize(size);

      const TARGET_HEIGHT = 2.0;
      const rawHeight = size.y > 0.001 ? size.y : 1.0;
      const scaleFactor = TARGET_HEIGHT / rawHeight;
      model.scale.setScalar(scaleFactor);

      model.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(model);
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);

      // Place character feet on podium top at Y = 0
      model.position.x = -center.x;
      model.position.z = -center.z;
      model.position.y = -box.min.y;

      const neededRadius = Math.max(0.95, size.x * 0.70);
      if (podiumMesh && podiumRimMesh && shadowMesh) {
        podiumMesh.scale.set(neededRadius / 0.95, 1, neededRadius / 0.95);
        podiumRimMesh.scale.set(neededRadius / 0.95, neededRadius / 0.95, 1);
        shadowMesh.scale.set(neededRadius / 0.95, neededRadius / 0.95, 1);
      }

      // Camera: Bold, prominent, fills the frame
      const totalVisualHeight = TARGET_HEIGHT + 0.12;
      const targetY = TARGET_HEIGHT * 0.48;
      controls.target.set(0, targetY, 0);

      const fovRad = camera.fov * (Math.PI / 180);
      let dist = (totalVisualHeight / 2) / Math.tan(fovRad / 2);
      if (camera.aspect < 1.0) {
        dist = dist / camera.aspect;
      }
      dist *= 1.05; // 5% margin: large and heroic

      camera.position.set(0, targetY, dist);
      controls.update();

      // Show initial selected card (Chest)
      selectHotspot(HOTSPOTS_DATA[0]);
    }

    function applyConceptMaterial() {
      if (!currentModel) return;

      currentModel.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;

          if (child.geometry) {
            child.geometry.computeVertexNormals();
          }

          child.material = new THREE.MeshStandardMaterial({
            map: conceptDiffuseTex,
            normalMap: normalTex,
            normalScale: new THREE.Vector2(2.4, 2.4),
            emissiveMap: emissiveTex,
            emissive: new THREE.Color(0xffffff),
            emissiveIntensity: 1.8,
            roughness: 0.68,
            metalness: 0.04
          });
        }
      });
    }

    function loadModel() {
      loadingOverlay.style.opacity = '1';
      loadingOverlay.style.visibility = 'visible';

      const fbxLoader = new THREE.FBXLoader();
      fbxLoader.load(
        './models/shadow_muscle.fbx',
        (fbx) => {
          currentModel = fbx;
          scene.add(currentModel);

          fitModelToScreen(currentModel);
          applyConceptMaterial();

          // Instant fadeout as soon as model is rendered
          requestAnimationFrame(() => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => {
              loadingOverlay.style.visibility = 'hidden';
            }, 300);
          });
        },
        (xhr) => {
          if (xhr.lengthComputable && xhr.total > 0) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            loadingProgress.textContent = `${pct}%`;
          }
        },
        (err) => {
          loadingText.textContent = `Ошибка: ${err.message}`;
        }
      );
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (currentModel) {
        fitModelToScreen(currentModel);
      }
    }

    function animate(time) {
      requestAnimationFrame(animate);

      // Hotspot pulsating animation
      const t = (time || 0) * 0.003;
      interactiveSprites.forEach(sprite => {
        const isSelected = sprite.userData && sprite.userData.id === activeHotspotId;
        const base = isSelected ? 0.22 : 0.17;
        const s = base + Math.sin(t * (isSelected ? 4 : 2.5)) * (isSelected ? 0.03 : 0.015);
        sprite.scale.set(s, s, 1);
      });

      // Smooth camera auto-glide to target angle when muscle selected
      if (isAutoRotating && targetAzimuth !== null) {
        const dist = Math.hypot(camera.position.x, camera.position.z);
        const currentAngle = Math.atan2(camera.position.x, camera.position.z);
        let diff = targetAzimuth - currentAngle;

        // Wrap difference to [-PI, +PI]
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;

        if (Math.abs(diff) < 0.015) {
          isAutoRotating = false;
          targetAzimuth = null;
        } else {
          const step = diff * 0.12;
          const nextAngle = currentAngle + step;
          camera.position.x = dist * Math.sin(nextAngle);
          camera.position.z = dist * Math.cos(nextAngle);
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
