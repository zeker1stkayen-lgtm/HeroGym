<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shadow Muscle — 3D Персонаж и Мышечная Карта</title>

  <!-- Local high-speed Three.js bundle (Zero external CDN dependency!) -->
  <script src="./js/three.min.js"></script>
  <script src="./js/OrbitControls.js"></script>
  <script src="./js/fflate.min.js"></script>
  <script src="./js/GLTFLoader.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #6a6c7b 0%, #4b4d5a 65%, #353641 100%);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas#c3d {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    /* Loading Overlay */
    #loadingOverlay {
      position: absolute;
      inset: 0;
      background: #4b4d5a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #ffffff;
    }
    .loading-sub {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 4px;
      font-family: monospace;
    }

    /* Floating Legend */
    .legend-bar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      z-index: 20;
      max-width: 96%;
      overflow-x: auto;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      color: #e2e8f0;
      padding: 2px 6px;
      border-radius: 12px;
    }
    .legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .dot-red { background: #E94F55; box-shadow: 0 0 6px rgba(233, 79, 85, 0.8); }
    .dot-yellow { background: #E8BC50; box-shadow: 0 0 6px rgba(232, 188, 80, 0.8); }
    .dot-green { background: #56B989; box-shadow: 0 0 6px rgba(86, 185, 137, 0.8); }
    .dot-gray { background: #646B78; }

    /* Interactive Muscle Info Pill */
    #muscleTooltip {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 20px;
      z-index: 25;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      transition: opacity 0.25s ease, transform 0.25s ease;
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #muscleTooltip.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .tooltip-title {
      font-size: 12px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tooltip-status {
      font-size: 10px;
      font-weight: 700;
      margin-top: 1px;
    }
    .tooltip-desc {
      font-size: 9.5px;
      color: #cbd5e1;
      margin-top: 2px;
    }

    /* 360 Hint */
    .hint-bar {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 9px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.65);
      background: rgba(0, 0, 0, 0.3);
      padding: 3px 8px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="hint-bar">🔄 360° • Тапни по мышце</div>

  <!-- Interactive Muscle Info Pill -->
  <div id="muscleTooltip">
    <div class="tooltip-title" id="ttTitle">
      <span class="legend-dot" id="ttDot"></span>
      <span id="ttName">Мышца</span>
    </div>
    <div class="tooltip-status" id="ttStatus">Статус</div>
    <div class="tooltip-desc" id="ttDesc">Описание</div>

  <!-- High-Speed Loading Overlay -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-title" id="loadingText">Загрузка Тени...</div>
    <div class="loading-sub" id="loadingProgress">0%</div>
  </div>

  <!-- Recovery Status Legend -->
  <div class="legend-bar">
    <div class="legend-item"><span class="legend-dot dot-red"></span>0–48ч (Нагрузка)</div>
    <div class="legend-item"><span class="legend-dot dot-yellow"></span>48–96ч (Восстановление)</div>
    <div class="legend-item"><span class="legend-dot dot-green"></span>96ч+ (Готовы)</div>
    <div class="legend-item"><span class="legend-dot dot-gray"></span>>14д (Отдых)</div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let currentModel = null;
    let podiumMesh = null;
    let podiumRimMesh = null;
    let shadowMesh = null;
    let eyesMesh = null;

    let keyLightFront, keyLightBack, lumbarLight, topLight, fillLightLeft, fillLightRight, ambLight;

    const canvas = document.getElementById('c3d');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const loadingProgress = document.getElementById('loadingProgress');

    const tooltip = document.getElementById('muscleTooltip');
    const ttDot = document.getElementById('ttDot');
    const ttName = document.getElementById('ttName');
    const ttStatus = document.getElementById('ttStatus');
    const ttDesc = document.getElementById('ttDesc');
    let tooltipTimeout = null;

    // ==========================================
    // MUSCLE RECOVERY DATA SPECIFICATION
    // ==========================================
    const MUSCLE_STATUS = {
      // 1. FATIGUED / RECENT WORKOUT (0-48h) -> RED (#E94F55)

      },
      deltoids: {

        color: 0xE94F55,
        hex: '#E94F55',
        dotClass: 'dot-red',

        statusColor: '#ff7b80',
        desc: 'Плечи нагружены: регенерация миофибрилл'

    function classifyMesh(p) {
      // Head / Hair / Eyes
      if (p.cy >= 0.74) {
        return 'head';
      }
      // Boots / Feet
      if (p.cy < 0.11) {
        return 'boots';
      }
      // Calves
      if (p.cy >= 0.11 && p.cy < 0.25) {
        return 'calves';
      }
      // Fists / Hands / Wrists
      if (p.idx === 46 || (p.cy < 0.44 && Math.abs(p.cx) > 0.23)) {
        return 'fists';
      }
      // Lower leg / Knee / Quads transition
      if (p.cy >= 0.25 && p.cy < 0.31 && Math.abs(p.cx) > 0.04) {
        return 'quads';
      }
      // Quads (Thighs) / Hamstrings
      if (p.cy >= 0.31 && p.cy < 0.42 && Math.abs(p.cx) > 0.04) {
        return 'quads';
      }
      // Pelvis / Glutes
      if (p.cy >= 0.38 && p.cy < 0.46 && Math.abs(p.cx) <= 0.10) {
        return 'glutes_pelvis';
      }
      // Forearms
      if (p.cy >= 0.44 && p.cy < 0.52 && Math.abs(p.cx) > 0.23) {
        return 'forearms';
      }
      // Abs (Lower: ~0.45, Mid: ~0.509, Upper: ~0.564)
      if (p.cy >= 0.44 && p.cy < 0.58 && Math.abs(p.cx) <= 0.065 && p.cz > 0.06) {
        return 'abs';
      }
      // Obliques / Lower flanks
      if (p.cy >= 0.48 && p.cy < 0.56 && Math.abs(p.cx) > 0.04 && Math.abs(p.cx) < 0.18 && p.cz >= 0.00) {
        return 'obliques';
      }
      // Biceps / Triceps (Upper arms)
      if (p.cy >= 0.52 && p.cy < 0.62 && Math.abs(p.cx) > 0.18) {
        return 'biceps_triceps';
      }
      // Deltoids (Shoulders)
      if (p.cy >= 0.62 && p.cy < 0.74 && Math.abs(p.cx) > 0.14) {
        return 'deltoids';
      }
      // Chest / Pectorals
      if (p.cy >= 0.59 && p.cy < 0.72 && Math.abs(p.cx) <= 0.15 && p.cz > 0.02) {
        return 'chest';
      }
      // Lats (Latissimus dorsi)
      if (p.cy >= 0.53 && p.cy < 0.64 && Math.abs(p.cx) <= 0.18 && p.cz <= 0.00) {
        return 'lats';
      }
      // Traps (Trapezius)
      if (p.cy >= 0.63 && p.cy < 0.74 && p.cz <= 0.00) {
        return 'traps';
      }

      return 'head'; // Fallback
    }

    function createContactShadowTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      const grad = ctx.createRadialGradient(256, 256, 40, 256, 256, 250);
      grad.addColorStop(0.0, 'rgba(12, 10, 20, 0.65)');
      grad.addColorStop(0.4, 'rgba(12, 10, 20, 0.38)');
      grad.addColorStop(0.75, 'rgba(12, 10, 20, 0.12)');
      grad.addColorStop(1.0, 'rgba(12, 10, 20, 0.0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      return new THREE.CanvasTexture(c);
    }

    function createEyeGlowTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');

      const grad = ctx.createRadialGradient(64, 64, 10, 64, 64, 60);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.4, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.7, 'rgba(235, 245, 255, 0.5)');
      grad.addColorStop(1.0, 'rgba(200, 220, 255, 0.0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(64, 64, 28, 54, 0, 0, Math.PI * 2);
      ctx.fill();

      return new THREE.CanvasTexture(c);
    }

    function init() {
      scene = new THREE.Scene();

      const aspect = window.innerWidth / window.innerHeight;
      camera = new THREE.PerspectiveCamera(36, aspect, 0.1, 100);
      camera.position.set(0, 1.0, 4.5);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      // Turntable controls: 100% horizontal 360 rotation
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.rotateSpeed = 0.85;
      controls.target.set(0, 0.95, 0);
      controls.minPolarAngle = Math.PI / 2;
      controls.maxPolarAngle = Math.PI / 2;
      controls.enableZoom = false;
      controls.enablePan = false;

      // ==========================================
      // LIGHTING RIG
      // ==========================================
      ambLight = new THREE.AmbientLight(0x353246, 0.45);
      scene.add(ambLight);

      // Key Raking Light Front (Pectorals, Abs)
      keyLightFront = new THREE.DirectionalLight(0xfff6eb, 1.95);
      keyLightFront.position.set(2.6, 3.8, 2.4);
      keyLightFront.castShadow = true;
      keyLightFront.shadow.mapSize.width = 1024;
      keyLightFront.shadow.mapSize.height = 1024;
      keyLightFront.shadow.bias = -0.001;
      scene.add(keyLightFront);

      // Rear Lumbar Light (Поясница и нижняя часть широчайших)
      lumbarLight = new THREE.DirectionalLight(0xfff3e6, 1.80);
      lumbarLight.position.set(2.2, 2.6, -2.8);
      lumbarLight.castShadow = true;
      lumbarLight.shadow.mapSize.width = 1024;
      lumbarLight.shadow.mapSize.height = 1024;
      lumbarLight.shadow.bias = -0.001;
      scene.add(lumbarLight);

      // Rear Upper Back / Traps
      keyLightBack = new THREE.DirectionalLight(0xf0e6ff, 1.40);
      keyLightBack.position.set(-2.4, 3.5, -2.6);
      scene.add(keyLightBack);

      // Top Downlight
      topLight = new THREE.DirectionalLight(0xffeedd, 0.90);
      topLight.position.set(0, 5.2, 0.2);
      scene.add(topLight);

      // Left & Right Rim Kickers (Edge separation)
      fillLightLeft = new THREE.DirectionalLight(0xa5b4fc, 1.25);
      fillLightLeft.position.set(-3.8, 2.2, 0);
      scene.add(fillLightLeft);

      fillLightRight = new THREE.DirectionalLight(0xa5b4fc, 1.25);
      fillLightRight.position.set(3.8, 2.2, 0);
      scene.add(fillLightRight);

      // ==========================================
      // CIRCULAR PODIUM
      // ==========================================
      const PODIUM_RADIUS = 0.95;
      const PODIUM_HEIGHT = 0.07;

      const podiumGeo = new THREE.CylinderGeometry(PODIUM_RADIUS, PODIUM_RADIUS * 1.04, PODIUM_HEIGHT, 48);
      const podiumMat = new THREE.MeshStandardMaterial({
        color: 0x686a77,
        roughness: 0.50,
        metalness: 0.08
      });
      podiumMesh = new THREE.Mesh(podiumGeo, podiumMat);
      podiumMesh.position.set(0, -PODIUM_HEIGHT / 2, 0);
      podiumMesh.receiveShadow = true;
      podiumMesh.castShadow = true;
      scene.add(podiumMesh);

      const rimGeo = new THREE.TorusGeometry(PODIUM_RADIUS, 0.012, 12, 48);
      const rimMat = new THREE.MeshStandardMaterial({
        color: 0xa78bfa,
        roughness: 0.2,
        metalness: 0.4
      });
      podiumRimMesh = new THREE.Mesh(rimGeo, rimMat);
      podiumRimMesh.rotation.x = Math.PI / 2;
      podiumRimMesh.position.set(0, 0, 0);
      scene.add(podiumRimMesh);

      // Ground Shadow
      const shadowTex = createContactShadowTexture();
      const shadowGeo = new THREE.PlaneGeometry(2.8, 2.8);
      const shadowMat = new THREE.MeshBasicMaterial({
        map: shadowTex,
        transparent: true,
        depthWrite: false
      });
      shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
      shadowMesh.rotation.x = -Math.PI / 2;
      shadowMesh.position.y = -PODIUM_HEIGHT - 0.002;
      scene.add(shadowMesh);

      window.addEventListener('resize', onWindowResize);
      setupRaycasting();

      loadModel();
      animate();
    }

    function fitModelToScreen(model) {
      if (!model) return;

      model.rotation.y = 0; // Model naturally faces forward (+Z)
      model.updateMatrixWorld(true);

      let box = new THREE.Box3().setFromObject(model);
      let size = new THREE.Vector3();
      box.getSize(size);

      const TARGET_HEIGHT = 2.0;
      const rawHeight = size.y > 0.001 ? size.y : 1.0;
      const scaleFactor = TARGET_HEIGHT / rawHeight;
      model.scale.setScalar(scaleFactor);

      model.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(model);
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);

      // Place character feet cleanly on podium top at Y = 0
      model.position.x = -center.x;
      model.position.z = -center.z;
      model.position.y = -box.min.y;

      const neededRadius = Math.max(0.95, size.x * 0.70);
      if (podiumMesh && podiumRimMesh && shadowMesh) {
        podiumMesh.scale.set(neededRadius / 0.95, 1, neededRadius / 0.95);
        podiumRimMesh.scale.set(neededRadius / 0.95, neededRadius / 0.95, 1);
        shadowMesh.scale.set(neededRadius / 0.95, neededRadius / 0.95, 1);
      }

      // Camera: Bold, prominent, fills the frame
      const totalVisualHeight = TARGET_HEIGHT + 0.12;
      const targetY = TARGET_HEIGHT * 0.48;
      controls.target.set(0, targetY, 0);

      const fovRad = camera.fov * (Math.PI / 180);
      let dist = (totalVisualHeight / 2) / Math.tan(fovRad / 2);
      if (camera.aspect < 1.0) {
        dist = dist / camera.aspect;
      }
      dist *= 1.05; // 5% margin: large and heroic

      camera.position.set(0, targetY, dist);
      controls.update();
    }

    function addGlowingEyes(parentGroup) {
      const eyeGeo = new THREE.PlaneGeometry(0.026, 0.052);
      const eyeTex = createEyeGlowTexture();
      const eyeMat = new THREE.MeshBasicMaterial({
        map: eyeTex,
        color: 0xffffff,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      const eyeLeft = new THREE.Mesh(eyeGeo, eyeMat);
      eyeLeft.position.set(-0.038, 0.835, 0.093);

      const eyeRight = new THREE.Mesh(eyeGeo, eyeMat);
      eyeRight.position.set(0.038, 0.835, 0.093);

      const eyeGroup = new THREE.Group();
      eyeGroup.add(eyeLeft);
      eyeGroup.add(eyeRight);
      parentGroup.add(eyeGroup);
    }

    const interactiveMeshes = [];

    function applyRecoveryMaterials(model) {
      let submeshIdx = 0;
      model.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;

          if (child.geometry) {
            child.geometry.computeVertexNormals();
            child.geometry.computeBoundingBox();

            const bbox = child.geometry.boundingBox;
            const center = new THREE.Vector3();
            bbox.getCenter(center);
            const size = new THREE.Vector3();
            bbox.getSize(size);

            const pInfo = {
              idx: submeshIdx,
              cx: center.x,
              cy: center.y,
              cz: center.z,
              sx: size.x,
              sy: size.y,
              sz: size.z
            };

            const groupKey = classifyMesh(pInfo);
            const data = MUSCLE_STATUS[groupKey] || MUSCLE_STATUS.head;

            const isBase = (groupKey === 'head' || groupKey === 'fists' || groupKey === 'boots');

            child.material = new THREE.MeshStandardMaterial({
              color: data.color,
              roughness: isBase ? 0.65 : 0.42,
              metalness: isBase ? 0.08 : 0.12,
              emissive: isBase ? 0x000000 : new THREE.Color(data.color),
              emissiveIntensity: isBase ? 0.0 : 0.18
            });

            child.userData = {
              groupKey: groupKey,
              name: data.name,
              status: data.status,
              statusColor: data.statusColor,
              desc: data.desc,
              dotClass: data.dotClass,
              originalColor: data.color,
              originalEmissiveIntensity: isBase ? 0.0 : 0.18,
              isBase: isBase
            };

            interactiveMeshes.push(child);
            submeshIdx++;
          }
        }
      });

      // Add the glowing eyes to the character head
      addGlowingEyes(model);
    }

    function setupRaycasting() {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let pointerDownPos = { x: 0, y: 0 };
      let lastHighlighted = null;

      window.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('pointerup', (e) => {
        // Prevent click trigger if the user dragged to rotate the model
        const dx = Math.abs(e.clientX - pointerDownPos.x);
        const dy = Math.abs(e.clientY - pointerDownPos.y);
        if (dx > 6 || dy > 6) return;

        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactiveMeshes, false);

        if (intersects.length > 0) {
          const hit = intersects[0].object;
          showTooltipForMesh(hit);
          pulseMesh(hit);
        }
      });

      function pulseMesh(mesh) {
        if (!mesh || !mesh.userData) return;
        const mat = mesh.material;
        const origEmissive = mesh.userData.originalEmissiveIntensity;
        mat.emissiveIntensity = origEmissive + 0.6;
        setTimeout(() => {
          mat.emissiveIntensity = origEmissive;
        }, 350);
      }
    }

    function showTooltipForMesh(mesh) {
      const d = mesh.userData;
      if (!d) return;

      ttName.textContent = d.name;
      ttStatus.textContent = d.status;
      ttStatus.style.color = d.statusColor;
      ttDesc.textContent = d.desc;

      ttDot.className = 'legend-dot ' + d.dotClass;

      tooltip.classList.add('visible');

      if (tooltipTimeout) clearTimeout(tooltipTimeout);
      tooltipTimeout = setTimeout(() => {
        tooltip.classList.remove('visible');
      }, 4000);
    }

    function loadModel() {
      loadingOverlay.style.opacity = '1';
      loadingOverlay.style.visibility = 'visible';

      const loader = new THREE.GLTFLoader();
      loader.load(
        './models/shadow_segmented.glb',
        (gltf) => {
          currentModel = gltf.scene;
          scene.add(currentModel);

          applyRecoveryMaterials(currentModel);
          fitModelToScreen(currentModel);

          // Instant fadeout as soon as model is rendered
          requestAnimationFrame(() => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => {
              loadingOverlay.style.visibility = 'hidden';
            }, 300);
          });
        },
        (xhr) => {
          if (xhr.lengthComputable && xhr.total > 0) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            loadingProgress.textContent = `${pct}%`;
          }
        },
        (err) => {
          console.error(err);
          loadingText.textContent = `Ошибка: ${err.message || 'Не удалось загрузить модель'}`;
        }
      );
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (currentModel) {
        fitModelToScreen(currentModel);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
