name: Build HeroGym IPA

on:
  workflow_dispatch: # Запуск вручную по кнопке
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Create Xcode Project using Swift Package
        run: |
          mkdir -p build
          echo "Building unsigned .app for sideloading..."
          
          # Компиляция в standalone runner
          swift build -c release || true

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload/HeroGym.app
          # Копируем скомпилированные ресурсы и манифест
          cat << 'EOF' > Payload/HeroGym.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>HeroGym</string>
              <key>CFBundleIdentifier</key>
              <string>com.yusup.herogym</string>
              <key>CFBundleName</key>
              <string>HeroGym</string>
              <key>CFBundleDisplayName</key>
              <string>HeroGym</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF
          
          zip -r HeroGym.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroGym-Sideloadly-IPA
          path: HeroGym.ipa
          retention-days: 7
